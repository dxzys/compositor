[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "compositor"
version = "0.1.0"
description = "Structured OCR pipeline for newspapers"
requires-python = ">=3.10"
dependencies = [
    "surya-ocr==0.17.1",
    "transformers<5",
    "pymupdf>=1.24",
    "pillow>=10.0",
    "numpy>=1.26",
    "requests>=2.31",
]

[project.scripts]
compositor = "compositor.cli:main"

[tool.setuptools]
packages = ["compositor"]

[tool.setuptools.package-data]
compositor = ["data/*.json"]
